name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: gamelibrary
          POSTGRES_PASSWORD: gamelibrary
          POSTGRES_DB: gamelibrary

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U gamelibrary"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: gamelibrary
      DB_PASSWORD: gamelibrary
      DB_NAME: gamelibrary
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm test -- --run

      - name: Run database migrations
        run: npm run migration:run
