services:
  postgres:
    image: postgres:17
    container_name: game-library-db

    environment:
      POSTGRES_USER: gamelibrary
      POSTGRES_PASSWORD: gamelibrary
      POSTGRES_DB: gamelibrary

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamelibrary -d gamelibrary"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest

    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
